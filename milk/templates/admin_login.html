<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body class="login-page">


<div class="login-card">


    <div class="login-icon">

        🔐

    </div>


    <h1>
        Admin Login
    </h1>


    <p class="login-subtitle">

        Login to access dashboard and history

    </p>


    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        action="/admin/login"
        method="POST"
    >


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn"
        >

            🔑 Login

        </button>


    </form>


    <a
        href="/"
        class="back-home"
    >

        ← Back to Milk Entry

    </a>


</div>


</body>

</html>
